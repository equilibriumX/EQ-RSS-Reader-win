name: Build EQ-RSS Reader for Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Qt 6.8.3 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtpositioning qtwebchannel'
          archives: 'qtsvg'
          cache: true
          setup-python: false

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Assemble portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/EQ-RSS-Reader.exe package/
          windeployqt --release --qmldir qml --dir package package/EQ-RSS-Reader.exe
          Copy-Item LICENSE package/
          Copy-Item THIRD_PARTY_NOTICES.md package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath EQ-RSS-Reader-Windows-x64-Portable.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc /Qp installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: EQ-RSS-Reader-Windows-Release
          path: |
            installer-output/EQ-RSS-Reader-Setup.exe
            EQ-RSS-Reader-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30
